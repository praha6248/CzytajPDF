[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czytajpdf"
version = "0.1.0"
description = "Page-wise Polish PDF text extraction with optional OCR and spelling repair"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20", "pypdfium2>=4.30", "numpy>=1.24", "pillow>=10"]
polish = ["morfeusz2>=1.99", "wordfreq>=3.1"]
