[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czytajpdf"
version = "0.3.0"
description = "Page-wise Polish and English PDF text extraction with optional OCR and spelling repair"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
ocr = ["tesserocr>=2.8,<3", "pooch>=1.8,<2", "rapidocr>=3.10,<4", "onnxruntime>=1.20", "pypdfium2>=4.30", "numpy>=1.24", "pillow>=10"]
polish = ["morfeusz2>=1.99", "wordfreq>=3.1"]
pl = ["morfeusz2>=1.99", "wordfreq>=3.1"]
english = ["wordfreq>=3.1"]
en = ["wordfreq>=3.1"]

[project.urls]
Homepage = "https://github.com/praha6248/CzytajPDF"
Repository = "https://github.com/praha6248/CzytajPDF"
Issues = "https://github.com/praha6248/CzytajPDF/issues"
