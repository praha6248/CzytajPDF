[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czytajpdf"
version = "0.4.0"
description = "Page-wise Polish and English PDF text extraction with optional OCR and spelling repair"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pdf", "ocr", "tesseract", "rapidocr", "polish", "english", "text-extraction", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = ["pypdf>=5"]

[project.scripts]
czytajpdf = "czytajpdf._cli:main"

[project.optional-dependencies]
ocr = ["tesserocr>=2.8,<3", "pooch>=1.8,<2", "rapidocr>=3.10,<4", "onnxruntime>=1.20", "pypdfium2>=4.30", "numpy>=1.24", "pillow>=10"]
polish = ["morfeusz2>=1.99", "wordfreq>=3.1"]
pl = ["morfeusz2>=1.99", "wordfreq>=3.1"]
english = ["wordfreq>=3.1"]
en = ["wordfreq>=3.1"]

[project.urls]
Homepage = "https://github.com/praha6248/CzytajPDF"
Repository = "https://github.com/praha6248/CzytajPDF"
Issues = "https://github.com/praha6248/CzytajPDF/issues"
