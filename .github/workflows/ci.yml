name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-base:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install . ./packages/readpdf-pl ./packages/readpdf-en
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  test-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install English extras without morfeusz2
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ocr,english]" ./packages/readpdf-en
      - name: Run English and base unit tests
        run: python -m unittest discover -s tests -v

  test-full-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install all packages, extras, and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[ocr,polish,english]" ./packages/readpdf-pl ./packages/readpdf-en build twine
      - name: Run full unit test suite
        run: python -m unittest discover -s tests -v
      - name: Build and verify all distributions
        run: |
          python -m build . --outdir dist
          python -m build packages/readpdf-pl --outdir dist
          python -m build packages/readpdf-en --outdir dist
          twine check --strict dist/*
