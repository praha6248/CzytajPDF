[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readpdf-en"
version = "0.3.1"
description = "Page-wise English PDF text extraction with optional OCR and spelling repair (powered by CzytajPDF)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["czytajpdf>=0.3.1,<0.4"]

[project.optional-dependencies]
ocr = ["czytajpdf[ocr]>=0.3.1,<0.4"]
english = ["czytajpdf[english]>=0.3.1,<0.4"]
en = ["czytajpdf[english]>=0.3.1,<0.4"]
all = ["czytajpdf[ocr,english]>=0.3.1,<0.4"]

[project.urls]
Homepage = "https://github.com/praha6248/CzytajPDF"
Repository = "https://github.com/praha6248/CzytajPDF"
Issues = "https://github.com/praha6248/CzytajPDF/issues"
