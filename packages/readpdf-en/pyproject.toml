[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readpdf-en"
version = "0.5.0"
description = "Page-wise English PDF text extraction with optional OCR and spelling repair (powered by CzytajPDF)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pdf", "ocr", "english", "tesseract", "text-extraction", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = ["czytajpdf>=0.5.0,<0.6"]

[project.scripts]
readpdf-en = "czytajpdf._cli:main_en"

[project.optional-dependencies]
ocr = ["czytajpdf[ocr]>=0.5.0,<0.6"]
english = ["czytajpdf[english]>=0.5.0,<0.6"]
en = ["czytajpdf[english]>=0.5.0,<0.6"]
all = ["czytajpdf[ocr,english]>=0.5.0,<0.6"]

[project.urls]
Homepage = "https://github.com/praha6248/CzytajPDF"
Repository = "https://github.com/praha6248/CzytajPDF"
Issues = "https://github.com/praha6248/CzytajPDF/issues"
